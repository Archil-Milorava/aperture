# Local dev + full-stack run for Aperture.
#
#   docker compose up --build     -> the WHOLE stack: Postgres + migrations + app
#   docker compose up -d postgres adminer   -> only the backing services
#
# Values like ${DB_USER} are read from your .env file automatically. The app and
# migrate services reach Postgres by its SERVICE NAME (`postgres`) on its
# CONTAINER port (5432) — NOT localhost / the host-mapped port.
services:
  postgres:
    image: postgres:16-alpine
    container_name: aperture-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      # host_port:container_port — the host reaches Postgres at localhost:${DB_PORT};
      # inside the Docker network it always listens on 5432.
      - '${DB_PORT}:5432'
    volumes:
      # Named volume so your data survives `docker compose down` / restarts.
      - aperture-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME}']
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot job: apply pending migrations, then exit. The app waits for this to
  # finish SUCCESSFULLY before it starts, so it never talks to an empty schema.
  # It reuses the `builder` stage (which has the source + ts-node + your migration
  # script), so the command run here is exactly the one you run locally.
  migrate:
    build:
      context: .
      target: builder
    image: aperture-migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres # service name on the Docker network, not localhost
      DB_PORT: 5432 # container port, not the host-mapped ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    command: npm run migration:run
    restart: 'no'

  # The Nest app, built into the small production image (Dockerfile `runner`).
  app:
    build:
      context: .
      target: runner
    image: aperture-app
    container_name: aperture-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully # wait for migrations to finish
      localstack:
        condition: service_healthy # S3 must be ready before the app uploads
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      # AWS / S3 — these point at LocalStack (fake AWS). The keys are dummy
      # values LocalStack accepts; real AWS would use real creds via .env.
      AWS_REGION: us-east-1
      AWS_S3_BUCKET: aperture-uploads
      AWS_S3_ENDPOINT: http://localstack:4566 # internal service name, not localhost
      AWS_S3_PUBLIC_ENDPOINT: http://localhost:4566 # browser-reachable, for signed URLs
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      REDIS_HOST: redis # service name on the Docker network
      REDIS_PORT: 6379
      KAFKA_BROKER: kafka:9092 # internal listener, over the Docker network
    ports:
      # Defaults to 3000; override with APP_PORT=3001 if 3000 is busy on the host.
      - '${APP_PORT:-3000}:3000'
    volumes:
      # Persist uploaded images across restarts (until they move to S3 in Phase B).
      - aperture-uploads:/app/uploads
    healthcheck:
      # No curl/wget in the slim image — use Node's built-in fetch to hit /health.
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # The WORKER — a separate process that consumes Kafka events and does the
  # background work. Same image as the app, but a different entry point
  # (node dist/worker instead of node dist/main).
  worker:
    build:
      context: .
      target: runner
    image: aperture-app # same image as `app`; built once, reused here
    container_name: aperture-worker
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      localstack:
        condition: service_healthy # needs S3 to read originals / write thumbnails
    environment:
      NODE_ENV: production
      KAFKA_BROKER: kafka:9092
      AWS_REGION: us-east-1
      AWS_S3_BUCKET: aperture-uploads
      AWS_S3_ENDPOINT: http://localstack:4566
      AWS_S3_PUBLIC_ENDPOINT: http://localhost:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    command: node dist/worker

  # Redis — in-memory store used for caching and rate limiting.
  redis:
    image: redis:7-alpine
    container_name: aperture-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  # Kafka — an event log / message bus. Producers publish events to "topics";
  # consumers read them. Runs in KRaft mode (no separate Zookeeper needed).
  kafka:
    image: apache/kafka:3.8.0
    container_name: aperture-kafka
    restart: unless-stopped
    ports:
      - '9094:9094' # host-facing listener, for CLI tools on your Mac
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # three listeners: INTERNAL (other containers), CONTROLLER (KRaft internals),
      # HOST (your Mac). Clients are told which address to use via ADVERTISED.
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,HOST://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,HOST://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # single-node dev settings (each topic needs only 1 copy)
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1',
        ]
      interval: 10s
      timeout: 10s
      retries: 15

  # LocalStack — a fake AWS that runs locally, so we can learn S3 with no AWS
  # account and no cost. We only enable the S3 service here.
  localstack:
    image: localstack/localstack:3
    container_name: aperture-localstack
    restart: unless-stopped
    environment:
      SERVICES: s3 # only start S3, nothing else
    ports:
      - '4566:4566' # LocalStack's single "edge" port for all AWS APIs
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:4566/_localstack/health']
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: aperture-adminer
    restart: unless-stopped
    ports:
      - '8080:8080'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  aperture-pgdata:
  aperture-uploads:
